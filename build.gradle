plugins {
    id 'groovy'
}

group = 'com.bn2k9'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {

}

test {
    useJUnitPlatform()
}

// Get the Java version.
def javaVersion = project.findProperty("javaVersion")

// Helper methods for the git hash.
def gitHash = providers.exec {
    commandLine "git", "rev-parse", "--short", "HEAD"
}.standardOutput.asText.map { it.trim() }

def dirty = providers.exec {
    commandLine "git", "status", "--porcelain"
}.standardOutput.asText.map { !it.trim().isEmpty() }

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(javaVersion as String)
    }
}

// Set the git hash if the jar has uncommitted changes.
tasks.withType(Jar).configureEach {
    def baseName = "${project.name}"

    archiveBaseName.set(
            providers.zip(gitHash, dirty) { hash, isDirty ->
                isDirty ? "${baseName}-${hash}" : baseName
            }
    )
}