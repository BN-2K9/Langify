plugins {
    id 'java'
}

group = 'com.bn2k9'
version = project.findProperty("version")

repositories {
    mavenCentral()
}

subprojects {
    apply plugin: 'java'

    dependencies {
        // Lombok dependency.
        compileOnly("org.projectlombok:lombok:1.18.46")
        annotationProcessor("org.projectlombok:lombok:1.18.46")
    }
}

// Get the Java version.
def javaVersion = project.findProperty("javaVersion")

// Helper methods for the git hash.
def gitHash = providers.exec {
    commandLine "git", "rev-parse", "--short", "HEAD"
}.standardOutput.asText.map { it.trim() }

def dirty = providers.exec {
    commandLine "git", "status", "--porcelain"
}.standardOutput.asText.map { !it.trim().isEmpty() }

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(javaVersion as String)
    }
}

// Set the git hash if the jar has uncommitted changes.
tasks.withType(Jar).configureEach {
    // Rename all jars to include a git hash if this is a dirty version.
    def baseName = "${project.name}"
    archiveBaseName.set(
            providers.zip(gitHash, dirty) { hash, isDirty ->
                isDirty ? "${baseName}-${hash}" : baseName
            }
    )

    // Set the destination of all jars in the build/output folder.
    destinationDirectory = file("$rootDir/build/output")

}