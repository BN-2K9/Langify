plugins {
    id 'com.gradleup.shadow' version '9.1.0'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation project(":Langify-Api")

    // For parsing the language files.
    compileOnly 'org.yaml:snakeyaml:2.4'

    // For MysSql Usage.
    compileOnly 'com.zaxxer:HikariCP:7.1.0'

    // For sqlLite Usage.
    compileOnly 'org.xerial:sqlite-jdbc:3.53.4.0'

    // For Https usage.
    compileOnly("tools.jackson.core:jackson-databind:3.2.4")
}

tasks {
    jar {
        archiveClassifier.set('unshaded')
    }

    shadowJar {
        archiveClassifier.set('')
    }

    build {
        dependsOn tasks.shadowJar
    }
}