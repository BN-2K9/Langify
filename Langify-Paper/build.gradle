plugins {
    id("java-library")
    id("io.papermc.paperweight.userdev") version "2.0.0-beta.21"
    id("xyz.jpenilla.run-paper") version "3.1.0"
    id 'com.gradleup.shadow' version '9.1.0'
}

repositories {
    mavenCentral()

    // PlaceholderApi
    maven {
        url = 'https://repo.extendedclip.com/releases/'
    }
}

dependencies {
    implementation project(":Langify-Core")
    compileOnly project(":Langify-Api")

    // Used for http acces.
    compileOnly("com.fasterxml.jackson.core:jackson-databind:2.22.3")

    // Used for BStats.
    implementation("org.bstats:bstats-bukkit:3.2.1")

    // Paperweight
    paperweight.paperDevBundle("26.1.2.build.+")

    // PlaceholderApi
    compileOnly 'me.clip:placeholderapi:2.12.3'

    // ItemsAdder
    compileOnly 'beer.devs:itemsadder-api:4.0.18-beta-10'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

tasks {
    runServer {
        // Configure the Minecraft version for our task.
        // This is the only required configuration besides applying the plugin.
        // Your plugin's jar (or shadowJar if present) will be used automatically.
        minecraftVersion("26.1.2")
        jvmArgs("-Xms2G", "-Xmx2G", "-Dcom.mojang.eula.agree=true")

        // Download the required plugin.
        downloadPlugins {
            // PlaceholderApi Plugin
            modrinth("placeholderapi", "2.12.3")
        }
    }

    jar {
        archiveClassifier.set('unshaded')
    }

    shadowJar {
        configurations = [project.configurations.runtimeClasspath]

        relocate("org.bstats", project.group.toString())

        archiveClassifier.set('')
    }

    build {
        dependsOn tasks.shadowJar
    }

    version = findProperty('version') ?: '1.0.0'
    description = findProperty('description') ?: ''

    def pluginVersion = rootProject.version.toString()
    def pluginDescription = rootProject.description?.toString() ?: ''

    processResources {
        filteringCharset = 'UTF-8'

        filesMatching('paper-plugin.yml') {
            expand(
                    version: pluginVersion,
                    description: pluginDescription
            )
        }
    }
}
